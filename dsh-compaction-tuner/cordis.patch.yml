# Bundle patch for dsh-compaction-tuner.
#
# One row owns the compaction-basic policy values every agent preset runs its
# `compaction-basic` child with. They are THE single control: this row's `config`
# is the source of truth, and each retune pass pushes the values into every
# `@deepseek-ai/dsh-agent-preset` row of the active profile.
#
# This patch seeds NOTHING: the inserted row carries no `config`, so the tuner
# runs the upstream compaction-basic code defaults (0.8 / 0.16 / 1) — the same
# values index.js `OPTION_SPECS` records and README "Initial values" documents.
# A fresh install therefore changes no preset by itself: `retune()` compares the
# projected tune, so a preset whose `compaction-basic` child declares none of
# the eleven keys already runs those defaults and is skipped with no write.
# Nothing reaches the profile patch until the user edits a value on the page.
#
# The row itself is persisted the same way as any other profile row: the
# settings page writes the active profile's `cordis.patch.yml` (the profile's
# own `cordis.patch.yml`, next to its `package.json`), and the per-preset copies
# retune writes live in that same profile patch file.
- insert:
    - id: compaction-tuner
      name: '@local/dsh-compaction-tuner'
