# Bundle patch for dsh-compaction-tuner.
#
# One row owns the compaction-basic policy values every agent preset runs its
# `compaction-basic` child with. They are THE single control: this row's `config`
# is the source of truth, and each retune pass pushes the values into every
# `@deepseek-ai/dsh-agent-preset` row of the active profile.
#
# The three seeded values below are an INSTALL-TIME choice, deliberately
# different from the upstream compaction-basic code defaults (0.8 / 0.16 / 1).
# They are NOT carried over from any shipped preset patch: a grep of every
# *.yml/*.yaml in the checkout finds no preset or bundle row that sets any
# compaction-BASIC option (only snapshot fixtures under snapshots/ set them; the
# sibling pruner's thresholdChars/headChars/tailChars ARE set by shipped
# presets, but this tuner never touches that plugin). Because
# the tuner projects this row's live values into every preset that omits a key,
# a preset without its own tune runs THESE values, not the code defaults. The
# other eight options are NOT seeded here, so they fall back to their code
# defaults (see index.js `OPTION_SPECS` and README "Initial values").
#
# The row itself is persisted the same way as any other profile row: the
# settings page writes the active profile's `cordis.patch.yml` (the profile's
# own `cordis.patch.yml`, next to its `package.json`), and the per-preset copies
# retune writes live in that same profile patch file.
- insert:
    - id: compaction-tuner
      name: '@local/dsh-compaction-tuner'
      config:
        thresholdRatio: 0.5
        retainRatio: 0.15
        compactionRetries: 2
