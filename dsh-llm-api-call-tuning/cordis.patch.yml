# Bundle patch for dsh-llm-api-call-tuning.
#
# One row owns the GLOBAL DEFAULT retry values the settings page offers as a
# preset. The provider rows stay authoritative: the page edits their
# `retryPolicy` directly, through the settings form API, and its provider-timeout
# card writes the per-route `streamIdleTimeoutMs` / `timeoutMs` /
# `filesApiTimeoutMs` leaves the same way; nothing is projected from this row and
# a fresh install changes no provider by itself. `apply()`
# does two things for the row: it suppresses the auto-generated settings page
# for this namespace (the hand-written page is the only page for the row), and
# it owns the opt-in process-wide fetch-timeout dispatcher. `headersTimeoutMs`
# and `bodyTimeoutMs` are flat leaves of THIS namespace, both unset by default,
# so no dispatcher is installed until the user saves a number (0 disables a
# timer; a positive value is the limit in milliseconds).
#
# This patch seeds NOTHING: the inserted row carries no `config`, so the page
# starts from the upstream retry-policy code defaults (normal / 5 / 500 /
# 10000 / 0.1 / all five codes; `packages/llm/llm/src/retry-policy.ts:12-19`) —
# the same values index.js `DEFAULT_TUNE` records and README "Defaults"
# documents. Nothing reaches the profile patch until the user saves a value.
#
# The row itself is persisted the same way as any other profile row: the
# settings page writes the active profile's `cordis.patch.yml` (the profile's
# own `cordis.patch.yml`, next to its `package.json`).
#
# The row name is the BARE package name on purpose: the client half attaches to
# the Loader row whose specifier is the bare package name.
- insert:
    - id: llm-api-call-tuning
      name: 'dsh-llm-api-call-tuning'
